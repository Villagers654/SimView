plugins {
    id 'java'
}

group = 'club.simview'
version = '0.3.0'

def supportedHytaleVersions = ['0.6.8', '0.7.0-pre.5.1']
def hytaleVersion = providers.gradleProperty('hytaleVersion').getOrElse('0.6.8')
if (!supportedHytaleVersions.contains(hytaleVersion)) {
    throw new GradleException("Unsupported Hytale API version: ${hytaleVersion}")
}

repositories {
    mavenCentral()
    maven {
        name = 'hytale'
        url = uri('https://maven.hytale.com/release')
    }
    maven {
        name = 'hytalePrerelease'
        url = uri('https://maven.hytale.com/pre-release')
    }

}

dependencies {
    compileOnly "com.hypixel.hytale:Server:${hytaleVersion}"
    testImplementation "com.hypixel.hytale:Server:${hytaleVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveBaseName.set('SimView')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

test {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}
